<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Password - XORpass Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">
  <div class="flex flex-1 relative overflow-hidden">

    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm z-30 hidden sm:hidden"></div>

    <aside id="default-sidebar" class="fixed sm:static top-0 left-0 z-40 w-64 h-full transition-transform -translate-x-full sm:translate-x-0 bg-gray-900 border-r border-gray-800 flex flex-col justify-between">
      <div class="p-5">
        <div class="flex items-center justify-between mb-8">
          <a href="/" class="flex items-center space-x-3">
            <img class="w-8 h-8 rounded" src="/static/logo.png" alt="XORpass Logo">
            <span class="text-xl font-bold tracking-tight text-white">XORpass</span>
          </a>
          <button onclick="toggleSidebar()" class="sm:hidden text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <nav class="space-y-1">
          <a href="/" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            Passwords
          </a>
          <a href="/settings" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl text-gray-400 hover:bg-gray-800 hover:text-white transition-colors">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Settings
          </a>
        </nav>
      </div>

      <div class="p-5 border-t border-gray-800">
        <a href="/logout" class="flex items-center px-4 py-3 text-sm font-medium rounded-xl text-red-400 hover:bg-red-500/10 transition-colors">
          <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </a>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header class="bg-gray-900/50 backdrop-blur border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center space-x-4">
          <button onclick="toggleSidebar()" class="sm:hidden p-2 rounded-lg bg-gray-800 text-gray-400 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <h1 class="text-xl font-bold text-white">Add New Password</h1>
            <p class="text-xs text-gray-400">Store credentials securely in your encrypted vault.</p>
          </div>
        </div>
      </header>

      <main class="p-6 max-w-2xl w-full mx-auto space-y-6">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="p-4 rounded-xl text-sm font-medium {% if category == 'success' %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% else %}bg-rose-500/10 text-rose-400 border border-rose-500/20{% endif %}" role="alert">
          {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="bg-gray-900 p-8 rounded-2xl border border-gray-800 shadow-xl">
          <form class="space-y-5" action="/add" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

            <div>
              <label for="website" class="block text-sm font-medium text-gray-300 mb-2">Website / Service</label>
              <input type="text" name="website" id="website" placeholder="e.g. github.com" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors" required>
            </div>

            <div>
              <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email / Username</label>
              <input type="text" name="email" id="email" placeholder="user@example.com" class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors" required>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                <button type="button" onclick="generatePassword()" class="text-xs font-semibold text-blue-400 hover:text-blue-300 flex items-center">
                  <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                  Generate Random
                </button>
              </div>
              <div class="relative">
                <input type="password" name="password" id="password" placeholder="••••••••" class="w-full pl-4 pr-12 py-3 bg-gray-950 border border-gray-800 rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors" required>
                <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-white">
                  <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <div class="pt-4 flex items-center space-x-4">
              <button type="submit" class="flex-1 px-5 py-3 text-sm font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-600/20 transition-all text-center">Save Password</button>
              <a href="/" class="px-5 py-3 text-sm font-semibold rounded-xl text-gray-400 bg-gray-800 hover:bg-gray-700 transition-all text-center">Cancel</a>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('default-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      sidebar.classList.toggle('-translate-x-full');
      backdrop.classList.toggle('hidden');
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
    }

    async function generatePassword() {
      try {
        const res = await fetch('/generate-password?length=18');
        const data = await res.json();
        const pwdInput = document.getElementById('password');
        pwdInput.value = data.password;
        pwdInput.type = 'text';
      } catch (err) {
        console.error('Failed to generate password:', err);
      }
    }
  </script>
</body>

</html>
